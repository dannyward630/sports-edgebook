name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity; one request a few times a week prevents it.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the REST API
        run: |
          set -a; source .env; set +a
          curl --fail --silent --show-error \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/markets?select=id&limit=1" > /dev/null
